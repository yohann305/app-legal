<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public legal pages for Yohann Taieb apps, including WordSearch Winners privacy policy and terms of use.">
  <title>App legal pages — Yohann Taieb</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1c2430;
      --muted: #4d5a6a;
      --line: #d9d3c7;
      --accent: #1f5f8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 3rem; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 0.5rem; }
    .lead { color: var(--muted); margin-bottom: 1.75rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem 1.35rem 1.4rem;
    }
    h2 { font-size: 1.2rem; margin: 0 0 0.35rem; }
    .app-meta { color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 0.9rem; margin: 0 0 0.85rem; }
    ul { padding-left: 1.2rem; margin: 0; }
    li { margin: 0.4rem 0; }
    a { color: var(--accent); }
    footer {
      margin-top: 1.75rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>App legal pages</h1>
    <p class="lead">Public privacy and terms documents for apps operated by Yohann Taieb. These pages are hosted for App Store and user reference.</p>
    <section class="card">
      <h2>WordSearch Winners</h2>
      <p class="app-meta">Also known as WordSearch International</p>
      <ul>
        <li><a href="wordsearch-winners/privacy.html">Privacy Policy</a></li>
        <li><a href="wordsearch-winners/terms.html">Terms of Use</a> (draft)</li>
      </ul>
    </section>
    <footer>
      <p>Repository: <a href="https://github.com/yohann305/app-legal">github.com/yohann305/app-legal</a></p>
    </footer>
  </main>
</body>
</html>
